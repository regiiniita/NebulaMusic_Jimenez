<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Iniciar sesión</h1>
            <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded">
                <div>
                    <label for="correo">Correo Electronico:
                    </label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@gmail.com"
                            required
                            minlength="5"
                            maxlength="100"
                            autocomplete="off"
                    >
                </div>
                <div>
                    <label for="contrasenia">Contraseña: </label>
                    <input
                        type="password"
                        id="contrasenia"
                        name="contrasenia"
                        placeholder="********"
                        required
                        minlength="8"
                    >
                </div>
                <div>
                    <input
                    type="submit"
                    >
                </div>

                <div>
                    <button type="submit"> Iniciar sesión</button>
                    <button type="reset"> Limpiar Formulario</button>
                </div>
            </form>
            <p>No tienes una cuenta? <a href="registro.html">Registrate aqui!</a> </p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
